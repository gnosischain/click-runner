  # Dune Bridge Flows (daily)
  dune-bridge-flows-daily-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dune-bridge-flows-daily-ingestor
    volumes:
      - ./queries:/app/queries
    environment:
      CH_HOST: ${CH_DB_HOST}
